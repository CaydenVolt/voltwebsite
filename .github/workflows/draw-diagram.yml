# Scheduled diagram drawer.
#
# Every Monday at 10:23 UTC, invokes Claude Code with the instructions in
# scripts/prompts/draw-next-diagram.md. The run reads docs/blog-image-specs.md,
# finds the next undrawn figure whose article exists, draws the SVG at 780
# canvas in the house style, wires it into the article, runs the content gate,
# and opens a PR.
#
# ACTIVATION: same as .github/workflows/draft-blog.yml. One ANTHROPIC_API_KEY
# secret covers both workflows.
#
# The schedule in docs/blog-image-specs.md has 15 remaining figures through Jan
# 2027. S4 and S5 are blocked on the Google Ads cluster being written, so until
# those articles exist the drawer will skip past them.

name: Draw diagram

on:
  schedule:
    # Minute 23, Monday 10:23 UTC. Shifted off :00/:30 so it does not land in a
    # global cron storm.
    - cron: "23 10 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  draw:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name  "volt-diagrammer"
          git config user.email "volt-diagrammer@users.noreply.github.com"

      - name: Install dependencies
        # Needed because the drawer runs the content gate (which compiles TS)
        # before opening the PR.
        run: npm ci

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Fire the drawer
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat scripts/prompts/draw-next-diagram.md | claude \
            --print \
            --permission-mode acceptEdits \
            --model claude-opus-4-7
