<!-- Figure 1 — Who claims the solar tax credit
     Article: how-to-sell-solar-after-the-tax-credit
     Paste inline. Labels are real text in the served HTML. -->

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675"
     width="1200" height="675" role="img"
     aria-labelledby="f1-title f1-desc"
     font-family="'Instrument Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <title id="f1-title">Who claims the solar tax credit</title>
  <desc id="f1-desc">When the homeowner owns the system, Section 25D ended on 31 December 2025. When a finance company owns the system through a lease or PPA, Section 48E still applies at 30% and reaches the homeowner as a lower monthly payment.</desc>

  <defs>
    <marker id="f1-arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#171410"/>
    </marker>
    <marker id="f1-arrow-grey" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5e574d"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="#f2ede3"/>

  <!-- Centre divider -->
  <line x1="600" y1="58" x2="600" y2="520" stroke="#5e574d" stroke-width="1" opacity="0.45"/>

  <!-- ================= LEFT COLUMN ================= -->

  <text x="300" y="72" text-anchor="middle" font-size="15" font-weight="600"
        letter-spacing="0.06em" fill="#5e574d"
        font-family="'Bricolage Grotesque', 'Instrument Sans', sans-serif">
    HOMEOWNER OWNS THE SYSTEM
  </text>

  <!-- Box: Cash or loan purchase -->
  <rect x="150" y="118" width="300" height="62" rx="2"
        fill="#e6dfd0" stroke="#171410" stroke-width="1.2"/>
  <text x="300" y="155" text-anchor="middle" font-size="19" fill="#171410">
    Cash or loan purchase
  </text>

  <line x1="300" y1="180" x2="300" y2="222" stroke="#171410" stroke-width="1.2"
        marker-end="url(#f1-arrow)"/>

  <!-- Box: Section 25D — struck through, greyed -->
  <rect x="150" y="228" width="300" height="62" rx="2"
        fill="#ece6d9" stroke="#5e574d" stroke-width="1.2"/>
  <text x="300" y="265" text-anchor="middle" font-size="21" font-weight="600" fill="#5e574d"
        font-family="'Bricolage Grotesque', 'Instrument Sans', sans-serif">
    Section 25D
  </text>
  <line x1="150" y1="228" x2="450" y2="290" stroke="#5e574d" stroke-width="1.2"/>

  <text x="300" y="316" text-anchor="middle" font-size="14" fill="#5e574d">
    Ended 31 December 2025
  </text>

  <!-- ================= RIGHT COLUMN ================= -->

  <text x="900" y="72" text-anchor="middle" font-size="15" font-weight="600"
        letter-spacing="0.06em" fill="#5e574d"
        font-family="'Bricolage Grotesque', 'Instrument Sans', sans-serif">
    FINANCE COMPANY OWNS THE SYSTEM
  </text>

  <!-- Box: Lease or PPA -->
  <rect x="750" y="118" width="300" height="62" rx="2"
        fill="#e6dfd0" stroke="#171410" stroke-width="1.2"/>
  <text x="900" y="155" text-anchor="middle" font-size="19" fill="#171410">
    Lease or PPA
  </text>

  <line x1="900" y1="180" x2="900" y2="222" stroke="#171410" stroke-width="1.2"
        marker-end="url(#f1-arrow)"/>

  <!-- Box: Section 48E — the single accent element -->
  <rect x="750" y="228" width="300" height="62" rx="2"
        fill="#e6dfd0" stroke="#e4572e" stroke-width="1.5"/>
  <text x="900" y="265" text-anchor="middle" font-size="21" font-weight="600" fill="#e4572e"
        font-family="'Bricolage Grotesque', 'Instrument Sans', sans-serif">
    Section 48E
  </text>

  <text x="900" y="316" text-anchor="middle" font-size="14" fill="#5e574d">
    30% still applies
  </text>

  <line x1="900" y1="334" x2="900" y2="378" stroke="#171410" stroke-width="1.2"
        marker-end="url(#f1-arrow)"/>

  <!-- Box: Lower monthly payment -->
  <rect x="750" y="384" width="300" height="62" rx="2"
        fill="#e6dfd0" stroke="#171410" stroke-width="1.2"/>
  <text x="900" y="421" text-anchor="middle" font-size="19" fill="#171410">
    Lower monthly payment
  </text>

  <text x="900" y="472" text-anchor="middle" font-size="14" fill="#5e574d">
    Reaches the homeowner as price,
  </text>
  <text x="900" y="492" text-anchor="middle" font-size="14" fill="#5e574d">
    not as a refund
  </text>

  <!-- ================= FOOTER STRIP ================= -->

  <rect x="80" y="548" width="1040" height="58" rx="2"
        fill="#e6dfd0" stroke="#5e574d" stroke-width="1" opacity="0.9"/>
  <text x="600" y="583" text-anchor="middle" font-size="14" fill="#5e574d">
    Placed in service by 31 December 2027 if construction began after 4 July 2026
  </text>

</svg>
