<!-- Figure 2 — Target response time against reality
     Article: speed-to-lead-for-solar-companies
     Spec: docs/blog-image-specs.md (P1)

     Both columns are quoted from that article's own table. Three of the five
     realities are not times, so their tracks run off the axis with an arrow
     rather than being placed at an invented point.

     Canvas is 780 wide on purpose, not 1200. The article column renders at
     about 797px, so a 1200 canvas scaled everything to 0.66 and put the
     smallest labels at 7px. At 780 it renders close to 1:1. Below lg the
     renderer gives it a horizontal scroller with a min-width, the same way
     the article's tables behave, so it never shrinks to unreadable.
     Paste inline. Labels are real text in the served HTML. -->

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 440"
     width="780" height="440" role="img"
     aria-labelledby="f2-title f2-desc"
     font-family="'Instrument Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="f2-title">First response time, target against what usually happens</title>
  <desc id="f2-desc">Five lead channels on a logarithmic time axis from thirty seconds to one week. Every target response falls inside fifteen minutes. Web form enquiries are usually answered in hours or the next morning, Business Profile messages a week later, and phone calls, live chat and social messages have no reliable response time at all. The reported industry average is about 47 hours.</desc>

  <rect width="780" height="440" fill="#f2ede3"/>

  <!-- heading -->
  <text x="14" y="32" font-size="11" letter-spacing="1.3" fill="#5e574d">FIRST RESPONSE BY CHANNEL</text>
  <text x="14" y="54" font-size="13" fill="#171410">Filled marks are the target. Hollow marks are what usually happens.</text>

  <!-- the five-minute threshold: the one accent element -->
  <text x="285" y="78" font-size="12" fill="#e4572e">Five minutes</text>
  <text x="285" y="92" font-size="11" fill="#e4572e">21x more likely to qualify inside this</text>
  <line x1="278.3" y1="98" x2="278.3" y2="330" stroke="#e4572e" stroke-width="1.5" stroke-dasharray="5 4"/>

  <!-- row 1: web form -->
  <line x1="190" y1="124" x2="570" y2="124" stroke="#e6dfd0" stroke-width="1"/>
  <text x="176" y="128" font-size="15" fill="#171410" text-anchor="end">Web form</text>
  <line x1="278.3" y1="124" x2="426.7" y2="124" stroke="#5e574d" stroke-width="1" stroke-dasharray="3 3"/>
  <circle cx="278.3" cy="124" r="4.5" fill="#171410"/>
  <text x="288" y="110" font-size="11" fill="#5e574d">5 min</text>
  <rect x="426.7" y="119.5" width="68.7" height="9" fill="none" stroke="#5e574d" stroke-width="1.5"/>
  <text x="582" y="128" font-size="11.5" fill="#5e574d">Hours, or the next morning</text>

  <!-- row 2: phone call -->
  <line x1="190" y1="168" x2="570" y2="168" stroke="#e6dfd0" stroke-width="1"/>
  <text x="176" y="172" font-size="15" fill="#171410" text-anchor="end">Phone call</text>
  <line x1="216.6" y1="168" x2="558" y2="168" stroke="#5e574d" stroke-width="1" stroke-dasharray="3 3"/>
  <circle cx="216.6" cy="168" r="4.5" fill="#171410"/>
  <text x="216.6" y="154" font-size="11" fill="#5e574d" text-anchor="middle">60 sec</text>
  <polygon points="558,163 570,168 558,173" fill="none" stroke="#5e574d" stroke-width="1.5"/>
  <text x="582" y="172" font-size="11.5" fill="#5e574d">Voicemail nobody checks</text>

  <!-- row 3: live chat -->
  <line x1="190" y1="212" x2="570" y2="212" stroke="#e6dfd0" stroke-width="1"/>
  <text x="176" y="216" font-size="15" fill="#171410" text-anchor="end">Live chat</text>
  <line x1="190" y1="212" x2="558" y2="212" stroke="#5e574d" stroke-width="1" stroke-dasharray="3 3"/>
  <circle cx="190" cy="212" r="4.5" fill="#171410"/>
  <text x="190" y="198" font-size="11" fill="#5e574d" text-anchor="middle">30 sec</text>
  <polygon points="558,207 570,212 558,217" fill="none" stroke="#5e574d" stroke-width="1.5"/>
  <text x="582" y="216" font-size="11.5" fill="#5e574d">Nobody is watching it</text>

  <!-- row 4: business profile message -->
  <line x1="190" y1="256" x2="570" y2="256" stroke="#e6dfd0" stroke-width="1"/>
  <text x="176" y="252" font-size="15" fill="#171410" text-anchor="end">Business Profile</text>
  <text x="176" y="268" font-size="15" fill="#171410" text-anchor="end">message</text>
  <line x1="278.3" y1="256" x2="570" y2="256" stroke="#5e574d" stroke-width="1" stroke-dasharray="3 3"/>
  <circle cx="278.3" cy="256" r="4.5" fill="#171410"/>
  <text x="288" y="242" font-size="11" fill="#5e574d">5 min</text>
  <circle cx="570" cy="256" r="4.5" fill="none" stroke="#5e574d" stroke-width="1.5"/>
  <text x="582" y="260" font-size="11.5" fill="#5e574d">Discovered a week later</text>

  <!-- row 5: facebook or instagram -->
  <line x1="190" y1="300" x2="570" y2="300" stroke="#e6dfd0" stroke-width="1"/>
  <text x="176" y="304" font-size="15" fill="#171410" text-anchor="end">Facebook or Instagram</text>
  <line x1="320.4" y1="300" x2="558" y2="300" stroke="#5e574d" stroke-width="1" stroke-dasharray="3 3"/>
  <circle cx="320.4" cy="300" r="4.5" fill="#171410"/>
  <text x="320.4" y="286" font-size="11" fill="#5e574d" text-anchor="middle">15 min</text>
  <polygon points="558,295 570,300 558,305" fill="none" stroke="#5e574d" stroke-width="1.5"/>
  <text x="582" y="304" font-size="11.5" fill="#5e574d">Whenever somebody opens the app</text>

  <!-- the reported industry average, for scale -->
  <text x="521.2" y="326" font-size="10.5" fill="#5e574d" text-anchor="middle">~47 hr reported average</text>
  <line x1="521.2" y1="331" x2="521.2" y2="340" stroke="#5e574d" stroke-width="1"/>

  <!-- axis -->
  <line x1="190" y1="340" x2="570" y2="340" stroke="#171410" stroke-width="1"/>
  <g font-size="11" fill="#5e574d" text-anchor="middle">
    <line x1="190"   y1="340" x2="190"   y2="345" stroke="#171410" stroke-width="1"/>
    <text x="190"   y="360">30 sec</text>
    <line x1="216.6" y1="340" x2="216.6" y2="345" stroke="#171410" stroke-width="1"/>
    <line x1="278.3" y1="340" x2="278.3" y2="345" stroke="#171410" stroke-width="1"/>
    <text x="278.3" y="360">5 min</text>
    <line x1="320.4" y1="340" x2="320.4" y2="345" stroke="#171410" stroke-width="1"/>
    <text x="320.4" y="360">15 min</text>
    <line x1="373.5" y1="340" x2="373.5" y2="345" stroke="#171410" stroke-width="1"/>
    <text x="373.5" y="360">1 hr</text>
    <line x1="426.7" y1="340" x2="426.7" y2="345" stroke="#171410" stroke-width="1"/>
    <text x="426.7" y="360">4 hr</text>
    <line x1="495.4" y1="340" x2="495.4" y2="345" stroke="#171410" stroke-width="1"/>
    <text x="495.4" y="360">24 hr</text>
    <line x1="570"   y1="340" x2="570"   y2="345" stroke="#171410" stroke-width="1"/>
    <text x="570"   y="360">1 week</text>
  </g>

  <!-- legend -->
  <circle cx="20" cy="386" r="4.5" fill="#171410"/>
  <text x="32" y="390" font-size="11.5" fill="#5e574d">Target</text>
  <circle cx="90" cy="386" r="4.5" fill="none" stroke="#5e574d" stroke-width="1.5"/>
  <text x="102" y="390" font-size="11.5" fill="#5e574d">What usually happens</text>
  <polygon points="228,381 240,386 228,391" fill="none" stroke="#5e574d" stroke-width="1.5"/>
  <text x="250" y="390" font-size="11.5" fill="#5e574d">No reliable response time at all</text>

  <text x="14" y="420" font-size="13" fill="#171410">Every one of these is the same lead.</text>
</svg>
