<!-- Figure 5 — When to ask for a review
     Article: how-to-get-more-reviews-for-solar-installers
     Spec: docs/blog-image-specs.md (P4)

     Four moments on a left-to-right timeline, taken from the article's
     own four-row table. Bar heights are relative descriptions, not
     percentages: the article gives response rates as "Moderate,
     Moderate, Highest, Low" and the diagram preserves that by leaving
     the vertical axis unnumbered. Putting figures on the bars would
     invent data the article does not claim.

     The accent sits on the First lower bill moment because that is
     the one the article argues for (and the reason the piece exists).
     Install day is the one most installers reach for and the article
     calls the worst moment that feels like the right one.

     780 canvas. Labels are real text in the served HTML. -->

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 440"
     width="780" height="440" role="img"
     aria-labelledby="f5-title f5-desc"
     font-family="'Instrument Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="f5-title">When to ask for a review</title>
  <desc id="f5-desc">A horizontal timeline with four moments: Install day, Commissioning day, First lower bill, and Twelve months. Bars above each moment show relative response rates, with no numeric axis because the article describes them as moderate, moderate, highest and low. The First lower bill moment is drawn in accent as the strongest moment to ask, both for response rate and for quality of what the reviewer writes.</desc>

  <rect width="780" height="440" fill="#f2ede3"/>

  <!-- heading -->
  <text x="20" y="30" font-size="11" letter-spacing="1.3" fill="#5e574d">WHEN TO ASK FOR A REVIEW</text>
  <text x="20" y="52" font-size="13" fill="#171410">Response rate against the moment of the ask.</text>

  <!-- Bar area:
       y=90 is the top of the tallest bar (First lower bill).
       y=270 is the baseline the bars sit on.
       Four columns centred on x = 130, 310, 490, 670.
       Bar width 110, so x_left = centre - 55. -->

  <!-- Install day bar: moderate -->
  <rect x="75"  y="170" width="110" height="100" fill="#e6dfd0" stroke="#5e574d" stroke-width="1"/>
  <text x="130" y="162" font-size="11" fill="#5e574d" text-anchor="middle">Moderate</text>

  <!-- Commissioning day bar: moderate -->
  <rect x="255" y="170" width="110" height="100" fill="#e6dfd0" stroke="#5e574d" stroke-width="1"/>
  <text x="310" y="162" font-size="11" fill="#5e574d" text-anchor="middle">Moderate</text>

  <!-- First lower bill bar: HIGHEST, accent -->
  <rect x="435" y="90"  width="110" height="180" fill="#e4572e" stroke="#e4572e" stroke-width="1"/>
  <text x="490" y="82"  font-size="11" fill="#e4572e" text-anchor="middle" font-weight="500">Highest</text>

  <!-- Twelve months bar: low -->
  <rect x="615" y="220" width="110" height="50"  fill="#e6dfd0" stroke="#5e574d" stroke-width="1"/>
  <text x="670" y="212" font-size="11" fill="#5e574d" text-anchor="middle">Low</text>

  <!-- Timeline baseline -->
  <line x1="20" y1="270" x2="760" y2="270" stroke="#171410" stroke-width="1"/>

  <!-- Tick marks under each bar -->
  <line x1="130" y1="270" x2="130" y2="275" stroke="#171410" stroke-width="1"/>
  <line x1="310" y1="270" x2="310" y2="275" stroke="#171410" stroke-width="1"/>
  <line x1="490" y1="270" x2="490" y2="275" stroke="#171410" stroke-width="1"/>
  <line x1="670" y1="270" x2="670" y2="275" stroke="#171410" stroke-width="1"/>

  <!-- Moment names -->
  <text x="130" y="295" font-size="14" fill="#171410" text-anchor="middle">Install day</text>
  <text x="310" y="295" font-size="14" fill="#171410" text-anchor="middle">Commissioning day</text>
  <text x="490" y="295" font-size="14" fill="#e4572e" text-anchor="middle" font-weight="500">First lower bill</text>
  <text x="670" y="295" font-size="14" fill="#171410" text-anchor="middle">Twelve months</text>

  <!-- Quality-of-review note under each (from the article's third column) -->
  <text x="130" y="320" font-size="11" fill="#5e574d" text-anchor="middle">Vague, about the</text>
  <text x="130" y="334" font-size="11" fill="#5e574d" text-anchor="middle">crew being tidy</text>

  <text x="310" y="320" font-size="11" fill="#5e574d" text-anchor="middle">Better, still</text>
  <text x="310" y="334" font-size="11" fill="#5e574d" text-anchor="middle">no results</text>

  <text x="490" y="320" font-size="11" fill="#5e574d" text-anchor="middle">Specific, with</text>
  <text x="490" y="334" font-size="11" fill="#5e574d" text-anchor="middle">numbers in it</text>

  <text x="670" y="320" font-size="11" fill="#5e574d" text-anchor="middle">Excellent when it</text>
  <text x="670" y="334" font-size="11" fill="#5e574d" text-anchor="middle">lands, rarely does</text>

  <!-- Vertical axis label (hairline, no numbers) -->
  <text x="20" y="175" font-size="10.5" letter-spacing="1" fill="#5e574d">RESPONSE RATE</text>

  <!-- Caption from the article's own takeaway -->
  <line x1="20" y1="378" x2="760" y2="378" stroke="#171410" stroke-width="1"/>
  <text x="20" y="406" font-size="13" fill="#171410">Time the ask to the first lower bill, not to the day the scaffolding comes down.</text>
</svg>
